<!--HTML structure consists of a head and a body, the head element contains anything that isnt visible on the actuale website page so this is things such as css, titles, favicons ect, the hbody element contains everythign that is visible, like text or images.-->
<!--i will recreate the text styles hytml file here using the html structure-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Styles</title>
    <link rel="stylesheet" href="../CSS/text-styles.css"><!--linking the external stylesheet to this html file(reduces clutter in one file and also allows for reusability)-->
</head>
    <body>
<!--youtube video name and title (simple)-->
        <p class="titles">
            Talking Tech and AI with Google CEO Sundar Pichai!
        </p>

        <p id="video-stats">
            3.4M views &#183; 6 months ago
        </p>

        <p id="name">
            Marques Brownlee &#10003;<!--html entities are special codes that create symbols-->
        </p>

        <p id="description"> 
            Talking tech and AI on the heels of Google 
            I/O. Also a daily driver phone reveal from 
            Google's CEO. Shoutout to Sundar!
        </p>  

        <!--simple apple-like text section-->
        <p id="text">
           Shop early for the best selection of holiday favourites. <span id="shop-now">Shop now ></span><!--text elements are used inline and provide certain bits of text with different css properties(u, strong,span,div)-->
        </p>

    </body>
</html>
